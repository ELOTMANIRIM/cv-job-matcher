<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV Job Matcher</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .container { max-width: 600px; margin: 0 auto; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; }
        input, button { width: 100%; padding: 10px; margin: 5px 0; }
        button { background: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI CV Job Matcher</h1>
        <form action="/upload" method="post" enctype="multipart/form-data">
            <div class="form-group">
                <label for="cv">Upload Your CV (PDF/DOCX):</label>
                <input type="file" id="cv" name="cv" accept=".pdf,.docx,.doc,.txt" required>
            </div>
            
            <div class="form-group">
                <label for="linkedin_url">LinkedIn Profile URL (Optional):</label>
                <input type="url" id="linkedin_url" name="linkedin_url" placeholder="https://linkedin.com/in/yourprofile">
            </div>
            
            <button type="submit">Find Matching Jobs</button>
        </form>
    </div>
</body>
</html>
